name: Build LaTeX + JSON

on:
  push:


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-full

      - name: Create folders
        run: |
          mkdir -p docs
          mkdir -p data

      # =========================
      # COMPILATION LATEX (FIX)
      # =========================
      - name: Debug uploads
        run: |
          echo "📂 Contenu de uploads :"
          ls -R uploads || true
      - name: Compile LaTeX
        run: |
          echo "🔍 Recherche des fichiers main.tex..."

          find uploads -type f -name "main.tex" | while read file; do
            
            dir=$(dirname "$file")
            name=$(basename "$dir")

            echo "📄 Compilation de $name dans $dir"

            # =========================
            # PATCH AUTOMATIQUE siunitx
            # =========================
            sed -i 's/\\begin{document}/\\usepackage{siunitx}\n\\begin{document}/' "$file"

            cd "$dir"

            pdflatex -interaction=nonstopmode main.tex || true
            pdflatex -interaction=nonstopmode main.tex || true

            cd -

            if [ -f "$dir/main.pdf" ]; then
              mv "$dir/main.pdf" "docs/$name.pdf"
              echo "✅ PDF généré : docs/$name.pdf"
            else
              echo "❌ ERREUR : pas de PDF pour $name"
            fi

          done

      # =========================
      # DEBUG (IMPORTANT)
      # =========================
      - name: Debug docs
        run: |
          echo "📂 Contenu du dossier docs :"
          ls -R docs || true

      # =========================
      # GENERATION JSON
      # =========================
      - name: Generate documents.json
        run: |
          echo "[" > data/documents.json
          first=1

          for file in docs/*.pdf; do
            name=$(basename "$file" .pdf)

            # NORMALISATION
            name=$(echo "$name" | tr ' ' '_' | tr '[:upper:]' '[:lower:]')

            IFS='_' read -r matiere niveau type reste <<< "$name"

            # MATIERE
            if [[ "$matiere" =~ ^(math|maths|mathematique|mathematiques)$ ]]; then
              matiere="maths"
            elif [[ "$matiere" =~ ^(phy|physique|physiquechimie|physique-chimie|pc)$ ]]; then
              matiere="physique"
            fi

            # NIVEAU
            if [[ "$niveau" =~ ^(term|terminale|tle|te)$ ]]; then
              niveau="terminale"
            elif [[ "$niveau" =~ ^(premiere|prem|1ere|première)$ ]]; then
              niveau="premiere"
            elif [[ "$niveau" =~ ^(troisieme|3eme|3ieme|troisième)$ ]]; then
              niveau="3eme"
            elif [[ "$niveau" =~ ^(sup|superieur|superieure|supérieur|supérieure|supp)$ ]]; then
              niveau="superieur"
            fi

            # TYPE
            if [[ "$type" =~ ^(exo|exos|td|exercice|exercices)$ ]]; then
              type="exercice"
            elif [[ "$type" =~ ^(ds|devoir|dm)$ ]]; then
              type="ds"
            elif [[ "$type" =~ ^(cours|cour|)$ ]]; then
              type="cours"
            elif [[ "$type" =~ ^(corr|corrige|correction)$ ]]; then
              type="corrige"
            fi

            # TITRE
            titre=$(echo "$reste" | sed 's/_/ /g')

            if [ $first -eq 0 ]; then echo "," >> data/documents.json; fi

            echo "  {" >> data/documents.json
            echo "    \"titre\": \"$titre\"," >> data/documents.json
            echo "    \"fichier\": \"$file\"," >> data/documents.json
            echo "    \"matiere\": \"$matiere\"," >> data/documents.json
            echo "    \"niveau\": \"$niveau\"," >> data/documents.json
            echo "    \"type\": \"$type\"" >> data/documents.json
            echo "  }" >> data/documents.json

            first=0
          done

          echo "]" >> data/documents.json

      # =========================
      # COMMIT AUTO
      # =========================
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs data/documents.json
          git commit -m "auto build pdf + json" || echo "no changes"
          git push